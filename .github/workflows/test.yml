name: Numerical contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python infer.py --json inference.json
      - run: python bench.py --repeats 3 --json benchmark.json
      - run: python -m nano_infer demo all --json lesson-results.json
      - run: python -m nano_infer tour --json shape-tour.json
      - run: python -m nano_infer verify --json verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: lesson-results-${{ matrix.os }}-${{ matrix.python }}
          path: |
            lesson-results.json
            shape-tour.json
            verification.json
            inference.json
            benchmark.json
