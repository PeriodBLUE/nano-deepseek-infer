name: Numerical contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python train.py --steps 20 --width 12 --context 16 --batch-size 2
      - run: python infer.py --checkpoint artifacts/tiny-trained.npz --prompt "the model " --max-tokens 24 --json trained-smoke.json
      - run: python infer.py --checkpoint checkpoints/tiny-trained.npz --prompt "the model " --max-tokens 64 --json trained-inference.json
      - run: python -m nano_infer.dspark --json dspark.json
      - run: python systems.py --json systems.json
      - run: python load_test.py --requests 4 --max-tokens 16 --json service-load.json
      - run: python infer.py --checkpoint checkpoints/tiny-trained.npz --batched --kv-blocks 64 --prompt "the model " --prompt "the cache " --max-tokens 32 --json batched-inference.json
      - run: python bench.py --checkpoint checkpoints/tiny-trained.npz --batched --repeats 3 --json batched-benchmark.json
      - run: python infer.py --json inference.json
      - run: python bench.py --repeats 3 --json benchmark.json
      - run: python -m nano_infer demo all --json lesson-results.json
      - run: python -m nano_infer tour --json shape-tour.json
      - run: python -m nano_infer verify --json verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: lesson-results-${{ matrix.os }}-${{ matrix.python }}
          path: |
            lesson-results.json
            shape-tour.json
            verification.json
            inference.json
            benchmark.json
            dspark.json
            trained-inference.json
            trained-smoke.json
            artifacts/training.json
            systems.json
            service-load.json
            batched-inference.json
            batched-benchmark.json
